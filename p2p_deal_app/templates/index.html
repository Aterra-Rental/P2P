<!DOCTYPE html>
<html>
<head>
    <title>P2P Deal Tracker</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
        input { display: block; width: 100%; margin: 8px 0; padding: 6px; }
        button { padding: 8px 16px; margin-top: 8px; }
        pre { background: #eee; padding: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <a href="http://localhost:5173/">← Back to Home</a>
    
    <h2>Create Deal</h2>
    <input id="buyer_id" placeholder="buyer_id (e.g. 1)">
    <input id="seller_id" placeholder="seller_id (e.g. 2)">
    <input id="middleman_id" placeholder="middleman_id (e.g. 3)">
    <input id="item_name" placeholder="item_name">
    <input id="price" placeholder="price">
    <button onclick="createDeal()">Create Deal</button>

    <h2>Check / Update Deal</h2>
    <input id="deal_id" placeholder="deal_id">
    <button onclick="getDeal()">Get Deal</button>
    <select id="status">
        <option value="pending">pending</option>
        <option value="active">active</option>
        <option value="completed">completed</option>
        <option value="cancelled">cancelled</option>
    </select>
    <button onclick="updateStatus()">Update Status</button>

    <h3>Result:</h3>
    <pre id="result"></pre>

    <script>
        async function createDeal() {
            const body = {
                buyer_id: document.getElementById("buyer_id").value,
                seller_id: document.getElementById("seller_id").value,
                middleman_id: document.getElementById("middleman_id").value,
                item_name: document.getElementById("item_name").value,
                price: document.getElementById("price").value
            };
            const res = await fetch("/api/deal", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            document.getElementById("result").textContent = JSON.stringify(await res.json(), null, 2);
        }

        async function getDeal() {
            const id = document.getElementById("deal_id").value;
            const res = await fetch(`/api/deal/${id}`);
            document.getElementById("result").textContent = JSON.stringify(await res.json(), null, 2);
        }

        async function updateStatus() {
            const id = document.getElementById("deal_id").value;
            const status = document.getElementById("status").value;
            const res = await fetch(`/api/deal/${id}/status`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status })
            });
            document.getElementById("result").textContent = JSON.stringify(await res.json(), null, 2);
        }
        const params = new URLSearchParams(window.location.search);
const dealIdFromUrl = params.get("deal_id");
if (dealIdFromUrl) {
    document.getElementById("deal_id").value = dealIdFromUrl;
    getDeal();
}

    </script>
</body>
</html>
